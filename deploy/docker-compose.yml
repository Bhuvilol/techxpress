# Vortex — server stack (staging + production).
#
# Runs on the EC2 host from /opt/vortex. Two containers:
#   backend — the API + Socket.IO image built by CI and pushed to ECR
#   caddy   — public entrypoint: automatic HTTPS (Let's Encrypt), HTTP→HTTPS
#             redirect, WebSocket-aware reverse proxy to the backend
#
# All configuration comes from /opt/vortex/.env (rendered from SSM Parameter
# Store at deploy time — never committed). See deploy/.env.example.
#
# Deploy sequence (run by CI over SSM, see deploy/README.md):
#   docker compose pull
#   docker compose run --rm backend npx prisma migrate deploy
#   docker compose up -d --remove-orphans

name: vortex

services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /vortex/${VORTEX_ENV:?set VORTEX_ENV in .env}/backend
        awslogs-create-group: "true"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /vortex/${VORTEX_ENV}/caddy
        awslogs-create-group: "true"

volumes:
  # Holds the issued TLS certificates — keep it so restarts don't re-request
  # certificates (Let's Encrypt rate limits).
  caddy_data:
  caddy_config:
